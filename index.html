<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>了解我</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#111827}
.app{max-width:720px;margin:auto;min-height:100vh;padding:24px 18px 40px}.card{background:white;border:1px solid #e7eaf0;border-radius:24px;padding:28px;box-shadow:0 12px 35px rgba(17,24,39,.07)}
h1{font-size:36px;line-height:1.15;margin:0 0 12px}h2{font-size:26px;margin:8px 0 14px}p{line-height:1.7;color:#5b6472}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#111827;color:white}
button.secondary{background:#eef1f6;color:#111827}.row{display:flex;gap:10px;justify-content:space-between;margin-top:22px}.row button{flex:1}
.progress{height:7px;background:#e9edf3;border-radius:9px;overflow:hidden;margin:12px 0 25px}.bar{height:100%;background:#111827;width:0;transition:.25s}
.option{display:block;width:100%;text-align:left;background:#f7f8fa;color:#1f2937;border:1px solid #e4e7ec;margin:10px 0;padding:15px;border-radius:14px;font-weight:600}
.option.selected{background:#111827;color:white;border-color:#111827}
textarea{width:100%;min-height:140px;border:1px solid #dfe3ea;border-radius:14px;padding:14px;font:inherit;resize:vertical;outline:none}
textarea:focus{border-color:#111827}.muted{font-size:14px;color:#7a8492}.tag{display:inline-block;padding:7px 11px;border-radius:999px;background:#eef1f6;margin:4px;font-size:14px}
.score{margin:16px 0}.scorehead{display:flex;justify-content:space-between;font-weight:700;margin-bottom:7px}.track{height:10px;background:#edf0f4;border-radius:10px;overflow:hidden}.fill{height:100%;background:#111827;border-radius:10px}
.quote{background:#f7f8fa;border-radius:16px;padding:18px;font-size:18px;line-height:1.7;margin:18px 0}
.hidden{display:none}.center{text-align:center}.smallspace{height:10px}
</style>
</head>
<body>
<div class="app">
  <div id="home" class="card">
    <div class="muted">PERSONAL DISCOVERY · V1</div>
    <h1>了解我</h1>
    <p>用几分钟回答一些问题。最后，我会根据你的答案，生成一份属于你的「个人画像」。</p>
    <p class="muted">没有标准答案。越诚实，结果越有意思。</p>
    <button onclick="start()">开始了解我 →</button>
  </div>

  <div id="quiz" class="card hidden">
    <div class="muted" id="counter"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <h2 id="question"></h2>
    <div id="options"></div>
    <div id="textBox" class="hidden"><textarea id="answerText" placeholder="写下你的真实想法……"></textarea></div>
    <div class="row">
      <button class="secondary" id="prev" onclick="prev()">上一题</button>
      <button id="next" onclick="next()">下一题</button>
    </div>
  </div>

  <div id="result" class="card hidden"></div>
</div>

<script>
const questions=[
 {q:"如果不用考虑钱，你最想把大量时间花在哪里？",type:"text"},
 {q:"你更害怕哪一种情况？",opts:["失败了","从来没有尝试过","失去重要的人","失去自由","我其实不太害怕失败"]},
 {q:"面对一个重大决定，你通常更依赖什么？",opts:["逻辑和分析","直觉和感觉","过去的经验","别人的建议","先行动再调整"]},
 {q:"下面哪个更接近你？",opts:["我喜欢探索未知","我喜欢把擅长的事情做到极致","我喜欢建立稳定的生活","我喜欢竞争和证明自己","我还在寻找方向"]},
 {q:"如果别人误解了你，你通常会？",opts:["马上解释清楚","懒得解释","看关系决定","用行动证明","会想很久为什么会被误解"]},
 {q:"你认为人生更像什么？",opts:["一场探索","一场游戏","一段旅程","一场竞争","没有固定答案"]},
 {q:"你希望五年后的自己最接近哪种状态？",opts:["拥有很强的能力","拥有很大的自由","拥有很多财富","拥有深厚的关系","拥有自己真正认可的生活"]},
 {q:"你做事时最容易出现的问题是？",opts:["想太多","拖延","容易分心","标准太高","开始很快但难以坚持"]},
 {q:"你最希望别人怎样评价你？",opts:["聪明","可靠","有创造力","有魄力","善良","真正做成过事情"]},
 {q:"最后，用一句话回答：你现在最想改变自己身上的什么？",type:"text"}
];
let i=0,answers=Array(questions.length).fill(null);

function start(){home.classList.add("hidden");quiz.classList.remove("hidden");render()}
function render(){
 const x=questions[i]; counter.textContent=`${i+1} / ${questions.length}`;
 bar.style.width=`${(i/questions.length)*100}%`; question.textContent=x.q;
 options.innerHTML=""; textBox.classList.toggle("hidden",x.type!=="text");
 if(x.type==="text"){answerText.value=answers[i]||""}
 else{x.opts.forEach((o,n)=>{let b=document.createElement("button");b.className="option"+(answers[i]===n?" selected":"");b.textContent=o;b.onclick=()=>{answers[i]=n;render()};options.appendChild(b)})}
 prev.disabled=i===0; prev.style.opacity=i===0?.45:1;
 next.textContent=i===questions.length-1?"生成我的画像":"下一题";
}
function saveText(){if(questions[i].type==="text")answers[i]=answerText.value.trim()}
function next(){saveText();if(i<questions.length-1){i++;render()}else{showResult()}}
function prev(){saveText();if(i>0){i--;render()}}
function label(n){return questions[n].opts?.[answers[n]]||""}

function showResult(){
 quiz.classList.add("hidden");result.classList.remove("hidden");
 const text1=answers[0]||"你还没有填写";
 const text2=answers[9]||"你还没有填写";
 const vals=answers.filter(x=>x!==null).length;
 const explore=[2,3,5,7].reduce((s,n)=>s+(typeof answers[n]==="number" && [0,1,4].includes(answers[n])?1:0),0);
 const freedom=(label(3).includes("探索")||label(6).includes("自由"))?88:68;
 const action=(label(2).includes("行动")||label(7).includes("坚持")||label(7).includes("标准"))?78:62;
 const reflection=(label(4).includes("想很久")||label(2).includes("逻辑")||label(5).includes("答案"))?82:65;
 const ambition=(label(6).includes("财富")||label(6).includes("能力")||label(6).includes("竞争"))?84:67;
 let tags=[];
 if(freedom>=80)tags.push("自主驱动"); if(reflection>=80)tags.push("思考型");
 if(action>=75)tags.push("行动倾向"); if(ambition>=80)tags.push("成长野心");
 if(!tags.length)tags=["正在探索","开放型","成长导向"];
 result.innerHTML=`
 <div class="muted">YOUR PROFILE</div><h1>你的画像</h1>
 <p>你完成了 ${vals}/${questions.length} 个问题。</p>
 <div>${tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
 <div class="quote">“${escapeHtml(text2)}”</div>
 ${score("探索与自主",freedom)}${score("行动倾向",action)}${score("反思深度",reflection)}${score("成长驱动力",ambition)}
 <h2>我看到的你</h2>
 <p>${makeSummary(text1)}</p>
 <h2>你的一个可能盲区</h2>
 <p>${makeBlind()}</p>
 <h2>下一步</h2>
 <p>不要把这份画像当成结论。它更像一面镜子：真正有价值的是，你是否认同它，以及哪些地方让你产生了反驳。</p>
 <div class="row"><button class="secondary" onclick="restart()">重新测试</button><button onclick="copyResult()">复制结果</button></div>`;
}
function score(name,v){return `<div class="score"><div class="scorehead"><span>${name}</span><span>${v}/100</span></div><div class="track"><div class="fill" style="width:${v}%"></div></div></div>`}
function makeSummary(t){
 const intro=t.length>20?`你真正想投入时间的事情是「${escapeHtml(t)}」。`:"你目前似乎还没有把答案完全说清楚。";
 return intro+" 从你的选择来看，你并不是单纯追求某一个标签的人。你更在意自己能否掌握方向、持续成长，并逐渐形成一套属于自己的判断标准。你可能会在“想得足够清楚”和“真正开始行动”之间来回拉扯，但这也意味着你对自己的选择有较高要求。";
}
function makeBlind(){
 if(label(7).includes("想太多")||label(2).includes("逻辑"))return "你可能会把“想清楚”当成“已经前进”。有些答案只有进入现实以后才会出现。";
 if(label(7).includes("拖延"))return "你可能不是没有目标，而是启动成本过高。把大目标拆成今天可以完成的一步，往往比等待状态更有效。";
 return "你可能会低估长期积累的力量。真正的变化通常不是某个瞬间决定的，而是许多次普通选择叠加出来的。";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function copyResult(){navigator.clipboard?.writeText(result.innerText).then(()=>alert("结果已复制"))}
function restart(){i=0;answers=Array(questions.length).fill(null);result.classList.add("hidden");quiz.classList.remove("hidden");render()}
render();
</script>
</body>
</html>
